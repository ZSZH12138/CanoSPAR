contract_version: "1.1.0"
cohort: hcp
column_map: hcp_column_map.yaml
availability_snapshot_date: "2026-07-25"
access:
  open_access: approved
  restricted_access: not_approved
logical_inputs:
  data_dictionary:
    patterns: ["dictionary.csv"]
    selection: exact
    required_columns: [columnHeader, description]
  unrelated_list:
    patterns: ["unrelated.csv"]
    selection: exact
    column_signature: [subject_id]
  subject_export:
    patterns: ["subjects.csv"]
    selection: exact
    column_signature:
      [subject_id, t1_count, fmri_count, dwi_complete, full_mr_complete, qc_issue,
       fluid_cognition_target, total_cognition_target, matrix_reasoning_target, release,
       acquisition]
  appendix_2025:
    patterns: ["appendix_2025.csv"]
    selection: exact
  access_record:
    patterns: ["access_record.csv"]
    selection: exact
  download_record:
    patterns: ["download_record.json"]
    selection: exact
  download_manifest:
    patterns: ["download_manifest.json"]
    selection: exact
  legacy_inventory:
    legacy_directory: legacy
    required: false
manifest_defaults:
  cohort_source: hcp_official_unrelated
  kinship_control_method: official_unrelated_cohort
target_selection:
  primary_target: CogFluidComp_Unadj
  secondary_targets: [CogTotalComp_Unadj, PMAT24_A_CR]
  task_type: regression
  primary_metric: MAE
