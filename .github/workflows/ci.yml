name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=:all: --index-url https://download.pytorch.org/whl/cpu torch==2.12.1+cpu
      - name: Install project dependencies
        run: python -m pip install -e ".[dev,research,workflow]"
      - name: Verify dependencies
        run: python -m pip check
      - name: Ruff lint
        run: ruff check src tests
      - name: Ruff format
        run: ruff format --check src tests
      - name: Type check
        run: mypy src/canospar
      - name: Unit tests
        shell: bash
        run: |
          set +e
          output="$(python -m pytest -q tests/unit 2>&1)"
          status=$?
          printf '%s\n' "$output"
          if ((status != 0)); then
            diagnostic="$(printf '%s\n' "$output" | tail -n 80)"
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=Unit test failure::$diagnostic"
          fi
          exit "$status"
      - name: Integration tests
        run: python -m pytest -q tests/integration
      - name: Run smoke, workflow, and coverage acceptance
        run: |
          python -m canospar.utils.smoke_test
          pre-commit run --all-files
          snakemake -n -s workflow/Snakefile
          python scripts/verify_week1.py
      - name: Package check
        run: |
          git diff --check
          python -m build
