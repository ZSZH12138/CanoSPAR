contract_version: "1.1.0"
cohort: hcp
column_map: hcp_column_map.yaml
access:
  open_access: approved
  restricted_access: not_approved
logical_inputs:
  data_dictionary:
    patterns: ["hcp_metadata/raw/**/*dictionary*.csv"]
    selection: latest
  unrelated_list:
    patterns: ["hcp_metadata/raw/**/*unrelated*.csv"]
    selection: latest
    column_signature: [subject_id]
  subject_export:
    patterns: ["hcp_metadata/raw/*YA_subjects_*.csv"]
    selection: latest
    column_signature:
      [subject_id, t1_count, fmri_count, dwi_complete, full_mr_complete, qc_issue,
       fluid_cognition_target, total_cognition_target, matrix_reasoning_target, release, acquisition]
  appendix_2025:
    patterns: ["hcp_metadata/docs/*2025*appendix*.pdf", "hcp_metadata/docs/*appendix*2025*.pdf"]
    selection: latest
  access_record:
    # The platform's download record is the authoritative combined access/download record.
    patterns: ["hcp_metadata/records/*download*record*.md", "hcp_metadata/records/*download*record*.json"]
    selection: latest
    record_role: combined_access_and_download
  download_record:
    patterns: ["hcp_metadata/records/*download*record*.md", "hcp_metadata/records/*download*record*.json"]
    selection: latest
  download_manifest:
    patterns: ["hcp_metadata/records/*download*manifest*.json"]
    selection: latest
    source_manifest:
      top_level: array
      stale_path_key: local_path
      filename_key: name
      sha256_key: sha256
      historical_record_patterns: ["sessionSummaryCSV_1200Release.zip"]
      record_name_patterns:
        data_dictionary: ["*dictionary*.csv"]
        unrelated_list: ["*unrelated*.csv"]
        subject_export: ["*YA_subjects_*.csv"]
        appendix_2025: ["*appendix*.pdf"]
        download_record: ["*download*record*.md"]
  legacy_inventory:
    legacy_directory: hcp_metadata/optional_legacy_reference/sessionSummaryCSV_1200Release
    required: false
manifest_defaults:
  cohort_source: hcp_official_unrelated
  kinship_control_method: official_unrelated_cohort
target_selection:
  primary_target: CogFluidComp_Unadj
  secondary_targets: [CogTotalComp_Unadj, PMAT24_A_CR]
  task_type: regression
  primary_metric: MAE
